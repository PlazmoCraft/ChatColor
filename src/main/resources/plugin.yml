name: ChatColor
version: '${version}'
main: dev.chatcolor.ChatColorPlugin
api-version: '1.21'
prefix: ChatColor
authors: [themaster1970sf]
description: Twitch-style colored nicknames in chat with SQLite storage

commands:
  color:
    description: Set a Twitch-style nickname color
    usage: /color [random|<color>|list]
    permission: chatcolor.color

permissions:
  chatcolor.color:
    description: Allows changing your nickname color
    default: true